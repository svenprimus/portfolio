<section class="section-project">
    <button [routerLink]="['']" fragment="section-projects" class="top-project-nav-wrapper left-hover">
        <img
            class="project-nav-arrow"
            id="project-arrow-back"
            src="./assets/design/00_hand-drawn-lines/03_portfolio/arrow-left.webp"
            alt="arrow back"
        />
        <label for="project-arrow-back">Go Back</label>
    </button>
    <app-project-details></app-project-details>
    <nav class="bot-project-nav-wrapper">
        <button class="project-nav-btn left-hover">
            <img
                class="project-nav-arrow"
                id="project-arrow-left"
                src="./assets/design/00_hand-drawn-lines/03_portfolio/arrow-left.webp"
                alt="arrow left"
            />
            <label for="project-arrow-left">Previous Project</label>
        </button>
        <button class="project-nav-btn right-hover">
            <label for="project-arrow-right">Next Project</label>
            <img
                class="project-nav-arrow project-nav-arrow--right"
                id="project-arrow-right"
                src="./assets/design/00_hand-drawn-lines/03_portfolio/arrow-right.webp"
                alt="arrow right"
            />
        </button>
    </nav>
</section>
