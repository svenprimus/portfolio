<!-- in that component use yet another service to fetch data by name -->
<article class="section-project-content-wrapper">
    <section class="section-project-summary">
        <header>
            <h2>{{ project()?.title }}</h2>
            <img
                class="underline"
                [style.width]="project()?.title.length + 'ch'"
                src="{{ underlineSrc() }}"
                aria-hidden="true"
            />
        </header>
        <div class="section-project-summary-description">
            <h3>Description</h3>
            <p>{{ project()?.description }}</p>
            <h3>Implementation Details</h3>
            <p>{{ project()?.details }}</p>
        </div>
        <div class="section-project-summary-details">
            <p><b>Duration:</b>{{ ' ' + project()?.duration }}</p>
            <div class="section-project-summary-tech">
                @for (tech of project()?.techs; track $index) {
                    <app-skill [isSmall]="true" [skillStr]="tech"></app-skill>
                }
            </div>
        </div>
    </section>
    <section class="section-project-preview">
        <div class="placeholder"></div>
        <img
            class="section-project-preview-img"
            src="{{ project()?.preview }}"
            alt="preview of {{ project()?.title }}"
        />
        <img class="brand" src="{{ featuredSrc() }}" alt="brand sticker" />
        <nav class="section-project-links">
            <app-button (click)="openLink(project()?.github)" [isDark]="false" [blend]="true">GitHub</app-button>
            <app-button (click)="openLink(project()?.livetest)" [isDark]="false" [blend]="true">Live Test</app-button>
        </nav>
    </section>
</article>
