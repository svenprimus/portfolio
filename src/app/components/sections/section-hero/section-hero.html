<section class="section-hero">
    <div class="section-hero__content">
        <section class="headline-top">
            <div>
                <div class="hello-wrapper">
                    <img src="./assets/icons/misc/waving_hand.svg" alt="waving hand" />
                    <p class="pseudo">I'M SVEN PRIMUS</p>
                </div>
                <h1>
                    <span class="upper w76">F</span>
                    <span class="lower w56 left01">r</span>
                    <span class="lower w78 left005">o</span>
                    <span class="lower w81 left007">n</span>
                    <span class="lower w51 left01">t</span>
                    <span class="lower w75">e</span>
                    <span class="lower w81 left007">n</span>
                    <span class="lower w82">d</span>
                </h1>
            </div>
            <app-profile-figure class="figure-desktop"></app-profile-figure>
        </section>
        <section class="headline-bot">
            <div>
                <h1>
                    <span class="upper w90">D</span>
                    <span class="upper w80">E</span>
                    <span class="upper w86">V</span>
                    <span class="upper w80">E</span>
                    <span class="upper w65">L</span>
                    <span class="upper w93">O</span>
                    <span class="upper w83">P</span>
                    <span class="upper w80">E</span>
                    <span class="upper w87">R</span>
                </h1>
                <app-button [routerLink]="['']" fragment="section-contact" [isDark]="false">Get In Touch</app-button>
            </div>
        </section>
        <section class="figure-mobile-wrapper">
            <app-profile-figure class="figure-mobile"></app-profile-figure>
        </section>
    </div>
</section>
