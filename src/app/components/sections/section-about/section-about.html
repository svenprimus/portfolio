<article id="section-about" class="section-about">
    <aside>
        <div class="location-sticker">
            <img src="./assets/design/02_ripped-paper/3_orange.webp" alt="sticky note" />
            <div class="location-sticker-content">
                <img src="./assets/icons/misc/remote.svg" aria-hidden="true" />
                <h3>{{ 'section-about.remote' | translate }}</h3>
            </div>
        </div>
        <div class="location-sticker">
            <img src="./assets/design/02_ripped-paper/2_purple.webp" alt="sticky note" />
            <div class="location-sticker-content">
                <img src="./assets/icons/misc/relocation.svg" aria-hidden="true" />
                <h3>{{ 'section-about.relocate' | translate }}</h3>
            </div>
        </div>
        <div class="location-sticker">
            <img src="./assets/design/02_ripped-paper/1_green.webp" alt="sticky note" />
            <div class="location-sticker-content slightly-upper">
                <img src="./assets/icons/misc/location.svg" aria-hidden="true" />
                <h3>{{ 'section-about.location' | translate }}</h3>
            </div>
        </div>
    </aside>
    <section class="location-blog">
        <h4>{{ 'section-about.subtitle' | translate }}</h4>
        <h2>{{ 'section-about.title' | translate }}</h2>
        <img src="./assets/design/00_hand-drawn-lines/01_about-me/line.webp" aria-hidden="true" />
        <p [innerHTML]="'section-about.text' | translate"></p>
        <app-button [routerLink]="['']" fragment="section-contact" class="btn-right" [isDark]="true">{{
            'section-about.btn' | translate
        }}</app-button>
    </section>
</article>
