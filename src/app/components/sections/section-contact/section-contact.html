<article class="section-contact">
    <div id="section-contact" class="section-contact-content">
        <img
            class="contact-sticker contact-img-mobile"
            src="./assets/design/03_stickers/00_round/sticker-brand-orange.webp"
            alt="branded by Sven Primus sticker"
        />
        <section class="section-contact-content-column section-contact-intro">
            <h4>{{ 'section-contact.subtitle' | translate }}</h4>
            <h2>{{ 'section-contact.title' | translate }}</h2>
            <p [innerHTML]="'section-contact.text' | translate"></p>
            <img
                class="contact-arrow contact-img-desktop"
                src="./assets/design/00_hand-drawn-lines/05_contact/arrow-right.webp"
                aria-hidden="true"
            />
        </section>
        <form
            [formGroup]="contactForm"
            (ngSubmit)="formSubmit()"
            class="section-contact-content-column section-contact-form"
        >
            <div class="contact-input-wrapper contact-input-wrapper-1">
                <label for="contact-name">{{ 'section-contact.name' | translate }}</label>
                <textarea
                    class="ta-fixed"
                    type="text"
                    id="contact-name"
                    formControlName="name"
                    (keydown)="focusNext($event)"
                    (focus)="onInputFocus('name')"
                    (blur)="onNameBlur()"
                    [class.form-error]="this.errorStr.name()"
                    [placeholder]="
                        this.errorStr.name() ?? this.valueStr.name() ?? ('section-contact.namesub' | translate)
                    "
                ></textarea>
            </div>
            <div class="contact-input-wrapper contact-input-wrapper-2">
                <label for="contact-mail">{{ 'section-contact.mail' | translate }}</label>
                <textarea
                    class="ta-fixed"
                    type="text"
                    id="contact-mail"
                    formControlName="mail"
                    (keydown)="focusNext($event)"
                    (focus)="onInputFocus('mail')"
                    (blur)="onMailBlur()"
                    [class.form-error]="this.errorStr.mail()"
                    [placeholder]="
                        this.errorStr.mail() ?? this.valueStr.mail() ?? ('section-contact.mailsub' | translate)
                    "
                ></textarea>
            </div>
            <div class="contact-input-wrapper contact-input-wrapper-3">
                <label for="contact-msg">{{ 'section-contact.message' | translate }}</label>
                <textarea
                    type="text"
                    id="contact-msg"
                    formControlName="msg"
                    (keydown)="focusNext($event)"
                    (focus)="onInputFocus('msg')"
                    [class.form-error]="this.errorStr.msg()"
                    (blur)="onMsgBlur()"
                    [placeholder]="
                        this.errorStr.msg() ?? this.valueStr.msg() ?? ('section-contact.messagesub' | translate)
                    "
                ></textarea>
            </div>
            <div class="privacy-policy-check">
                <div class="privacy-policy-check-wrapper">
                    <input type="checkbox" id="contact-legal" formControlName="policy" />
                </div>
                <label for="contact-legal" [innerHTML]="'section-contact.terms' | translate"> </label>
            </div>
            <img
                class="contact-sticker contact-sticker-absolute contact-img-desktop"
                src="./assets/design/03_stickers/00_round/sticker-brand-orange.webp"
                alt="branded by Sven Primus sticker"
            />
            <div class="section-contact-send">
                <img
                    class="contact-arrow contact-img-mobile"
                    src="./assets/design/00_hand-drawn-lines/05_contact/arrow-right.webp"
                    aria-hidden="true"
                />

                <app-button
                    type="submit"
                    [buttonType]="'submit'"
                    [disabled]="contactForm.invalid"
                    [isDark]="false"
                    [minWidth]="'154px'"
                    >{{ 'section-contact.btn' | translate }}</app-button
                >
            </div>
        </form>
    </div>
</article>
