<article class="section-projects">
    <div id="section-projects" class="section-anchor"></div>
    <section class="section-projects-headline">
        <header>
            <h4>{{ 'section-projects.subtitle' | translate }}</h4>
            <h2>{{ 'section-projects.title' | translate }}</h2>
            <img src="./assets/design/00_hand-drawn-lines/03_portfolio/underline.webp" aria-hidden="true" />
        </header>
        <p>{{ 'section-projects.text' | translate }}</p>
    </section>
    <section class="project-preview">
        <button [routerLink]="['projects', 'join']" class="project-preview-img-wrapper">
            <img
                class="project-preview-highlight"
                src="./assets/img/preview-join-laptop.webp"
                alt="preview of a task managing project"
            />
            <img
                class="highlight-sticker"
                src="./assets/design/03_stickers/00_round/sticker-projects.webp"
                alt="sticker for highlighted project"
            />
            <app-button class="btn-details" [isDark]="false">Project details</app-button>
        </button>
        <h3>Join</h3>
        <p>{{ 'projects.join.description' | translate }}</p>
        <app-button [routerLink]="['projects', 'join']" [isDark]="true" class="btn-details-mobile"
            >Project details</app-button
        >
    </section>
    <section class="project-preview">
        <button [routerLink]="['projects', 'el-pollo-loco']" class="project-preview-img-wrapper">
            <img
                class="project-preview-img"
                src="./assets/img/preview-pollo-loco.webp"
                alt="preview of a jump and run game about a mexican and chickens"
            />
            <app-button class="btn-details" [isDark]="false">Project details</app-button>
        </button>
        <h3>El Pollo Loco</h3>
        <p>{{ 'projects.el-pollo-loco.description' | translate }}</p>
        <app-button [routerLink]="['projects', 'el-pollo-loco']" [isDark]="true" class="btn-details-mobile"
            >Project details</app-button
        >
    </section>
</article>
