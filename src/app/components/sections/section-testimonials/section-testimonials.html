<article class="section-testimonials">
    <header class="section-testimonials-header">
        <div>
            <img src="./assets/design/00_hand-drawn-lines/04_testimonials/arrow-left.webp" aria-hidden="true" />
            <h4>{{ 'testimonial.subtitle' | translate }}</h4>
        </div>
        <h2>{{ 'testimonial.title' | translate }}</h2>
    </header>
    <div class="testimonial-wrapper">
        <app-testimonial
            [author]="'Wanja Mueller'"
            [role]="'testimonial.wanja.title' | translate"
            [linkedInUrl]="'https://www.linkedin.com/in/wanjamueller/'"
            >{{ 'testimonial.wanja.text' | translate }}
        </app-testimonial>
        <app-testimonial
            [author]="'Eva Bojorges'"
            [role]="'testimonial.eva.title' | translate"
            [linkedInUrl]="'https://www.linkedin.com/in/eva-bojorges'"
            >{{ 'testimonial.eva.text' | translate }}
        </app-testimonial>
        <app-testimonial
            [author]="'Christian Luca Civello'"
            [role]="'testimonial.christian.title' | translate"
            [linkedInUrl]="'https://www.linkedin.com/in/christian-luca-civello-8857aa94'"
            >{{ 'testimonial.christian.text' | translate }}
        </app-testimonial>
    </div>
</article>
